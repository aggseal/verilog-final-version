<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#263b5b"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2d65aa"/></marker>
  <style>
    text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18263b}.title{font-size:30px;font-weight:700;fill:#173f73}.sub{font-size:17px;fill:#52647b}.boundary{fill:#fbfcfe;stroke:#254e83;stroke-width:3}.box{fill:#eef4fb;stroke:#466f9f;stroke-width:2.5;rx:12}.name{font-size:22px;font-weight:700;fill:#173f73}.func{font-size:15px;fill:#52647b}.port{font-size:15px;fill:#20344f}.wire{fill:none;stroke:#263b5b;stroke-width:2.4;marker-end:url(#arrow)}.bus{fill:none;stroke:#2d65aa;stroke-width:3;marker-end:url(#arrowBlue)}.busplain{fill:none;stroke:#2d65aa;stroke-width:3}.label{font-size:15px;font-weight:600;fill:#183d68}.external{fill:#fff7e8;stroke:#c38b35;stroke-width:2.5;rx:12}.extname{font-size:20px;font-weight:700;fill:#8b5a12}.note{font-size:14px;fill:#66758a}
  </style>
</defs>
<rect width="1800" height="1120" fill="#fff"/>
<text x="900" y="48" text-anchor="middle" class="title">UART 收发与数码管显示系统硬件框图</text>
<text x="900" y="77" text-anchor="middle" class="sub">按 top.v 实际模块与信号连接绘制；Top 仅表示系统边界，不作为子模块</text>
<rect x="150" y="105" width="1485" height="950" rx="18" class="boundary"/>
<text x="178" y="139" class="name">EGO1 FPGA 系统内部</text>
<text x="18" y="174" class="label">clk（1）</text><path d="M150 168 H1580" class="busplain"/><path d="M90 168 H150" class="bus"/>
<text x="18" y="207" class="label">rst（1，高有效）</text><path d="M150 201 H1580" class="busplain"/><path d="M120 201 H150" class="bus"/>
<rect x="18" y="264" width="112" height="76" class="external"/><text x="74" y="294" text-anchor="middle" class="extname">按键 S2</text><text x="74" y="320" text-anchor="middle" class="note">key_s2</text>
<rect x="220" y="245" width="185" height="145" class="box"/><text x="312" y="281" text-anchor="middle" class="name">debounce</text><text x="312" y="307" text-anchor="middle" class="func">按键同步消抖</text><text x="236" y="342" class="port">in key_in（1）</text><text x="236" y="367" class="port">out key_clean（1）</text>
<rect x="475" y="245" width="190" height="145" class="box"/><text x="570" y="281" text-anchor="middle" class="name">edge_detect</text><text x="570" y="307" text-anchor="middle" class="func">检测按键上升沿</text><text x="490" y="342" class="port">in signal_in（1）</text><text x="490" y="367" class="port">out rise_pulse（1）</text>
<rect x="735" y="225" width="260" height="185" class="box"/><text x="865" y="263" text-anchor="middle" class="name">tx_controller</text><text x="865" y="289" text-anchor="middle" class="func">组织消息、请求发送并计数</text><text x="752" y="327" class="port">in start（1）, tx_done（1）</text><text x="752" y="353" class="port">out tx_valid（1）, tx_data（8）</text><text x="752" y="379" class="port">out sent_count（8，BCD）</text>
<rect x="1080" y="245" width="210" height="145" class="box"/><text x="1185" y="281" text-anchor="middle" class="name">uart_send</text><text x="1185" y="307" text-anchor="middle" class="func">UART 8N1 字节发送</text><text x="1095" y="342" class="port">in valid（1）, data（8）</text><text x="1095" y="367" class="port">out done（1）, dout（1）</text>
<path d="M130 302 H220" class="wire"/><text x="157" y="286" class="label">key_s2（1）</text><path d="M405 344 H475" class="wire"/><text x="408" y="328" class="label">key_s2_clean（1）</text><path d="M665 344 H735" class="wire"/><text x="669" y="328" class="label">key_s2_press（1）</text>
<path d="M995 329 H1080" class="wire"/><text x="997" y="313" class="label">tx_data[7:0]</text><path d="M995 365 H1080" class="wire"/><text x="997" y="385" class="label">tx_valid（1）</text><path d="M1080 342 H1035 V399 H995" class="wire"/><text x="1020" y="420" class="label">tx_done（1）</text>
<rect x="1650" y="285" width="130" height="145" class="external"/><text x="1715" y="323" text-anchor="middle" class="extname">PC 串口</text><text x="1715" y="354" text-anchor="middle" class="port">接收 FPGA 数据</text><text x="1715" y="383" text-anchor="middle" class="port">发送测试数据</text><path d="M1290 355 H1650" class="wire"/><text x="1300" y="338" class="label">uart_tx（1）→ PC</text>
<rect x="220" y="635" width="220" height="160" class="box"/><text x="330" y="674" text-anchor="middle" class="name">uart_recv</text><text x="330" y="700" text-anchor="middle" class="func">UART 8N1 字节接收</text><text x="237" y="738" class="port">in din（1）</text><text x="237" y="765" class="port">out data（8）, valid（1）</text>
<rect x="650" y="615" width="270" height="200" class="box"/><text x="785" y="655" text-anchor="middle" class="name">uart_display</text><text x="785" y="681" text-anchor="middle" class="func">ASCII 转换、缓存字符与计数</text><text x="667" y="720" class="port">in rx_data（8）, rx_valid（1）</text><text x="667" y="746" class="port">in sent_count（8，BCD）</text><text x="667" y="772" class="port">out display（32）, blank_mask（8）</text>
<rect x="1080" y="635" width="235" height="190" class="box"/><text x="1197" y="674" text-anchor="middle" class="name">led_ctrl_unit</text><text x="1197" y="700" text-anchor="middle" class="func">动态扫描数码管</text><text x="1097" y="730" class="port">in display（32）, blank_mask（8）</text><text x="1097" y="757" class="port">out led_en（8）</text><text x="1097" y="782" class="port">out led_cx0（8）</text><text x="1097" y="807" class="port">out led_cx1（8）</text>
<rect x="1650" y="650" width="130" height="180" class="external"/><text x="1715" y="691" text-anchor="middle" class="extname">EGO1 数码管</text><text x="1715" y="721" text-anchor="middle" class="port">8 位七段显示</text><text x="1715" y="750" text-anchor="middle" class="note">位选 + 段选</text>
<path d="M1650 405 H1645 V835 H330 V795" class="wire"/><text x="1020" y="828" class="label">uart_rx（1） PC → FPGA</text>
<path d="M440 730 H650" class="wire"/><text x="462" y="711" class="label">rx_data[7:0]</text><path d="M440 770 H650" class="wire"/><text x="472" y="792" class="label">rx_valid（1）</text>
<path d="M865 410 V555 H785 V615" class="wire"/><text x="799" y="548" class="label">sent_count[7:0]</text>
<path d="M920 720 H1080" class="wire"/><text x="930" y="701" class="label">display[31:0]</text><path d="M920 770 H1080" class="wire"/><text x="932" y="794" class="label">blank_mask[7:0]</text>
<path d="M1315 740 H1650" class="wire"/><text x="1320" y="733" class="label">led_en[7:0]</text><path d="M1315 775 H1650" class="wire"/><text x="1320" y="768" class="label">led_cx0[7:0]</text><path d="M1315 810 H1650" class="wire"/><text x="1320" y="803" class="label">led_cx1[7:0]</text>
<!-- common clock/reset branches -->
<path d="M300 168 V245" class="bus"/><path d="M315 201 V245" class="bus"/><path d="M550 168 V245" class="bus"/><path d="M565 201 V245" class="bus"/><path d="M800 168 V225" class="bus"/><path d="M815 201 V225" class="bus"/><path d="M1130 168 V245" class="bus"/><path d="M1145 201 V245" class="bus"/>
<path d="M270 168 V635" class="bus"/><path d="M285 201 V635" class="bus"/><path d="M680 168 V615" class="bus"/><path d="M695 201 V615" class="bus"/><path d="M1110 168 V635" class="bus"/><path d="M1125 201 V635" class="bus"/>
<rect x="190" y="850" width="1050" height="155" rx="12" fill="#f3f7fc" stroke="#c5d4e5" stroke-width="1.5"/><text x="215" y="884" class="name" style="font-size:20px">模块划分思路</text><text x="215" y="915" class="note">发送链路：消抖与边沿检测把按键变成单周期请求；tx_controller 组织“19+学号”并统计完成字节；uart_send 负责串行时序。</text><text x="215" y="944" class="note">接收显示链路：uart_recv 按 UART 时序还原字节；uart_display 做 ASCII 映射、最近字符缓存和发送计数整理；</text><text x="215" y="973" class="note">led_ctrl_unit 独立完成数码管扫描与段码输出，便于模块化调试和复用。</text>
<text x="1315" y="870" class="note">所有子模块共享 clk（100 MHz）与 rst（高有效异步复位）</text><text x="1315" y="895" class="note">led_cx0、led_cx1 各为 8 位段选输出</text>
<text x="190" y="1085" class="note">箭头表示数据/控制方向；括号内为位宽。框内已简述子模块功能，报告正文可补充模块划分思路。</text>
</svg>






